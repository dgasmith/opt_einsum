name: Tests

on:
  push:
    branches: main
  pull_request:
    branches: main

jobs:
  tests:
    name: py${{ matrix.python-version }} / ${{ matrix.environment }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            environment: core
          - python-version: "3.13"
            environment: backends
          - python-version: "3.13"
            environment: torch
          - python-version: "3.15"
            environment: core
          - python-version: "3.15"
            environment: numpy

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7.0.1

    - uses: astral-sh/setup-uv@v10.3.2
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true

    - name: Run tests
      run: make PYTHON=${{ matrix.python-version }} test-${{ matrix.environment }}

    - uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
